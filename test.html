<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Track Line Test</title>
    <style>
        /* 기본 바디 스타일 */
        body {
            margin: 0;
            padding: 0;
            height: 10000px; /* 스크롤을 위해 높이를 설정 */
            background-color: #f5f5f5; /* 배경 색상 설정 */
        }

        /* 스크롤 시 보이는 탑바 스타일 */
        .top-bar {
            position: fixed; /* 화면에 고정 */
            top: 0; /* 상단에 위치 */
            right: 0; /* 오른쪽에 위치 */
            width: 50px; /* 너비 설정 */
            height: 100%; /* 높이 설정 */
            background-color: rgba(220, 40, 40, 0.8); /* 반투명 배경 */
            display: flex; /* Flexbox로 정렬 */
            justify-content: center; /* 수평 중앙 정렬 */
            align-items: flex-end; /* 아래쪽 정렬 */
            z-index: 999; /* 다른 요소 위에 보이도록 설정 */
            padding-bottom: 20px; /* 아래쪽 여백 */
        }

        /* 스크롤 위치를 나타내는 라인 스타일 */
        .scroll-line {
            width: 2px; /* 너비 2px */
            height: 20px; /* 높이 20px */
            background-color: gray; /* 기본 회색 */
            transition: background-color 0.3s ease; /* 부드러운 색상 변경 효과 */
        }
    </style>
</head>
<body>
    <!-- 스크롤 시 보이는 탑바 -->
    <div class="top-bar">
        <div class="scroll-line" id="scrollLine"></div> <!-- 스크롤 라인 -->
    </div>

    <script>
        const scrollLine = document.getElementById('scrollLine');
        const maxScroll = document.body.scrollHeight - window.innerHeight; // 최대 스크롤 가능 높이

        // 스크롤 이벤트 리스너
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY; // 현재 스크롤 위치

            // 스크롤이 진행될수록 라인 색상 변경
            const scrollPercentage = currentScrollY / maxScroll; // 스크롤 비율
            const colorValue = Math.min(255, Math.floor(scrollPercentage * 255)); // 색상 값 계산
            scrollLine.style.backgroundColor = `rgb(${colorValue}, 0, 0)`; // 색상 설정 (붉은색으로 변환)

            // 스크롤 위치에 따라 탑바의 위치 조정
            if (currentScrollY > 100) { // 스크롤이 100px 이상일 때
                scrollLine.style.height = `${20 + scrollPercentage * 100}px`; // 스크롤 비율에 따라 높이 조정
            } else {
                scrollLine.style.height = '20px'; // 기본 높이
            }
        });
    </script>
</body>
</html>
