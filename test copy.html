<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting Animation</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        /* CSS 최적화 */
        body {
            font-family: 'pretendard', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        #counting-animation {
  font-family: var(--kr-font);
}

.counters.bg-parallax .statistic-timer,
.counters.bg-parallax .counter-text,
.counters.bg-color .statistic-timer,
.counters.bg-color .counter-text {
  color: #fff;
}

.counters.bg-parallax .statistic-timer:after,
.counters.bg-color .statistic-timer:after {
  border-color: #fff;
}

.statistic-border-right {
  border-right: 1px solid rgba(255, 255, 255, 0.2);
}

.statistic-timer {
  color: #a7a7a7;
  font-size: 3rem;
  font-family: var(--kr-font);
  font-weight: 400;
  line-height: 1.2;
  transition: 0.5s;
}

.statistic-timer.text-active {
  font-size: 3rem;
  color: #ea5520 !important;
  font-family: var(--kr-font);
  font-weight: 900;
}

.statistic-timer:after {
  content: "";
  display: block;
  width: 50px;
  border-bottom: 1px solid #a3a3a3;
  margin: 15px auto 23px;
  z-index: 1;
  position: relative;
}

@media only screen and (max-width: 768px) {
  .statistic-timer {
    font-size: 48px;
  }
}



.statistic-1 {
  padding: 20px 0;
}

.statistic-1.last {
  border-right: 0;
}

.statistic-1 .statistic-timer {
  font-size: 48px;
  font-weight: 400;
}

.statistic-1 .statistic-timer:after {
  display: none;
}

.statistic-1 .counter-text {
  font-size: 5rem;
  font-family: var(--kr-font);
  margin-bottom: 5px;
}

.counter-text {
  margin-bottom: 0;
  font-size: 1rem;
  font-weight: 400;
  color: #222;
  font-family: var(--kr-font);
}

.statistic.with-icon .statistic-timer {
  display: block;
  margin: 20px 0;
}
    </style>
</head>

<body>

    <!-- counting-animation Section -->
    <section id="counting-animation">
        <div class="statistic">
            <span class="statistic-timer" data-from="0" data-to="1124213226">0</span>
            <h5 class="counter-text">누적판매량</h5>
        </div>

        <div class="statistic">
            <span class="statistic-timer" data-from="0" data-to="50600467">0</span>
            <h5 class="counter-text">전년생산량(<span id="current-year">2023</span>)</h5>
        </div>

        <div class="statistic">
            <span class="statistic-timer" data-from="0" data-to="928">0</span>
            <h5 class="counter-text">다봉과 함께 한 고객사</h5>
        </div>
    </section>

    <script>
        const statisticTimers = document.querySelectorAll(".statistic-timer");

        // 현재 연도 및 업력 계산
        const currentYear = new Date().getFullYear();
        const yearsSince1981 = currentYear - 1981 + 1; // 1981는 설립연도임.

        // '전년생산량'의 연도 자동화
        document.getElementById("current-year").textContent = currentYear - 1;

        // 업력 자동화
        // const yearsCountElement = document.getElementById("years-count");
        // yearsCountElement.dataset.to = yearsSince1981;
        // yearsCountElement.textContent = yearsSince1981;

        function countingAnimation(timer, delay) {
            const dataFrom = parseInt(timer.dataset.from, 10); // 시작값 가져오기
            const dataTo = parseInt(timer.dataset.to, 10); // 목표값 가져오기
            const duration = 2000; // 애니메이션 속도 조정 (밀리초)

            let currentCount = dataFrom;
            const increment = (dataTo - dataFrom) / (duration / 16); // 프레임당 증가량 계산

            const animate = () => {
                currentCount += increment;
                timer.textContent = Math.floor(currentCount); // 표시되는 값 업데이트

                if (currentCount < dataTo) {
                    requestAnimationFrame(animate);
                } else {
                    timer.textContent = dataTo; // 목표값 설정
                    timer.classList.add('text-active');
                }
            };

            setTimeout(() => {
                animate();
            }, delay); // 지정된 지연 후 애니메이션 시작
        }

        // .statistic-timer이 화면에 보일 때 애니메이션 실행
        const targetElement = document.querySelector(".statistic-timer");

        // 옵션 설정
        const countanioptions = {
            root: null, // viewport를 사용
            rootMargin: '0px',
            threshold: 0.95 // 요소가 95% 보일 때
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach((entry, idx) => {
                if (entry.isIntersecting) {
                    // 0.8초 간격으로 애니메이션 실행
                    countingAnimation(entry.target, idx * 800); // 각 타이머마다 지연시간 설정
                    observer.unobserve(entry.target); // 애니메이션 실행 후 옵저버 해제
                }
            });
        }, countanioptions);

        // 타겟 엘리먼트를 관찰 시작
        statisticTimers.forEach(timer => {
            observer.observe(timer);
        });

    </script>

</body>

</html>
