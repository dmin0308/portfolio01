<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            list-style: none;
            font-family: 'arial', sans-serif;
            text-decoration: none;
            font-weight: 400;
            color: #000;
        }

        body {
            height: 200vh;
        }

        .quick {
            transition: all cubic-bezier(0.645, 0.045, 0.355, 1) 0.35s;
        }

        .quick-holder {
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
        }

        .quick-holder li {
            margin: 0px 5px;
        }

        .quick-holder li a::after {
            content: "/";
            display: inline;
            padding-left: 10px;
        }

        .quick-holder li:last-child a::after {
            display: none;
        }

        .quick-holder.icons li {
            padding: 0px 5px;
        }

        /* 아이콘에 ::before 사용 */
        .quick-holder.icons li i::before {
            transform: rotate(90deg);
        }

        .quick-holder.icons li i {
            transition: color 0.3s ease;
        }

        .quick-holder.icons li a:hover i {
            color: #0094FF; /* 호버 시 아이콘 색상 파란색으로 변경 */
        }

        .quick-holder.icons li a::after {
            display: none;
        }

        .quick,
        .scroll-top {
            margin-right: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            transition: all cubic-bezier(0.645, 0.045, 0.355, 1) 0.35s;
        }

        .elements-bar {
            position: fixed;
            top: 50%;
            min-height: 3.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .elements-bar>li {
            padding: 0;
        }

        .elements-bar.left {
            z-index: 4;
            transform-origin: left top;
            transform: rotate(-90deg) translate(-50%, 0);
            left: 4vh;
        }

        .elements-bar.right {
            z-index: 3;
            transform-origin: right top;
            transform: rotate(-90deg) translate(50%, -100%);
            right: 4vh;
        }

        .scroll-top {
            opacity: 0;
            visibility: hidden;
        }

        .scroll-top-bar {
            width: 3.75rem;
            height: 0.125rem;
            margin-right: 1rem;
            position: relative;
        }

        .scroll-top-bar::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 100%;
            background-color: #000;
            opacity: .25;
        }

        .scroll-track {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            background-color: #0094FF;
            width: 0;
            transition: width 0.35s ease;
        }

        .scroll-top.visible {
            visibility: visible;
            opacity: 1;
            transition: opacity 0.35s ease;
        }
    </style>
</head>

<body>
    <ul class="elements-bar left">
        <li>
            <a class="scroll-top" href="#">
                <div class="scroll-top-bar">
                    <div class="scroll-track"></div>
                </div>
                <div class="scroll-top-holder">
                    Scroll to top
                </div>
            </a>
        </li>
    </ul>

    <ul class="elements-bar right">
        <li>
            <div class="quick">
                <ul class="quick-holder icons">
                    <li>Quick</li>
                    <li>—</li>
                    <li>
                        <a href="#">
                            <i class="bi bi-bag-fill"></i>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="bi bi-bag-fill"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </li>
    </ul>

    <script>
        function handleScroll() {
            var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            var documentHeight = document.documentElement.scrollHeight - window.innerHeight;
            var scrollPercentage = (scrollTop / documentHeight) * 100;

            document.querySelector('.scroll-track').style.width = scrollPercentage + "%";

            var scrollTopButton = document.querySelector('.scroll-top');
            if (scrollTop > 100) {
                scrollTopButton.classList.add('visible');
            } else {
                scrollTopButton.classList.remove('visible');
            }
        }

        function debounce(func, wait = 15) {
            let timeout;
            return function () {
                const later = () => {
                    clearTimeout(timeout);
                    func();
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        window.addEventListener('scroll', debounce(handleScroll));

        document.querySelector('.scroll-top').addEventListener('click', function (e) {
            e.preventDefault();
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>

</html>
